# sweep.yaml
program: train.py
method: grid
metric:
  name: val/loss
  goal: minimize
parameters:
  # The Variables
  lr_max:
    values: [3e-4, 6e-4, 1e-3, 3e-3]
  
  # The Fixed Architecture (GPT-2 Small)
  d_model:
    value: 768
  num_heads:
    value: 12
  num_layers:
    value: 12
  d_ff:
    value: 2048
  context_length:
    value: 1024
  
  # The Training Settings
  batch_size:
    value: 64          # Safe start, but H100 fits way more
  max_iters:
    value: 3000        # Short sweep
  warmup_iters:
    value: 100
  
  # Paths & Misc
  train_path:
    value: data-output/owt_train.bin
  val_path:
    value: data-output/owt_valid.bin
  weight_decay:
    value: 0.1
  grad_clip:
    value: 1.0
  log_interval:
    value: 50
  out_dir:
    value: checkpoints/sweep_results

command:
  - uv
  - run
  - python
  - ${program}
  - ${args}